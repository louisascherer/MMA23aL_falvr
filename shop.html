<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flavr. – Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="top-bar">
        <div class="logo">
          <a href="index.html"
            ><img src="images/flavr-logo.png" alt="flavr." class="logo-img"
          /></a>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center">
          <button id="cartBtn" class="cart-button">
            🛒 Warenkorb (<span id="cartCount">0</span>)
          </button>
          <a href="shop.html" class="bestellen-link">Bestellen</a>
        </div>
        <div class="hamburger"><span></span><span></span><span></span></div>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="erlebnisse.html">Erlebnisse</a>
        <a href="ueber-uns.html">Über uns</a>
      </div>
    </header>

    <main class="container">
      <h1>Unsere Gewürze</h1>
      <p>Handverlesene Qualität – direkt aus der Mühle.</p>
      <div class="product-grid" id="productGrid">
        <!-- [Alle Produkte mit data-Attributen, wie zuvor] -->
        <!-- Der Einfachheit halber werden hier nur Platzhalter gezeigt – bitte die vollständige Liste aus Ihrer vorherigen shop.html übernehmen -->
        <div
          class="product-card"
          data-id="anissterne"
          data-name="Anissterne"
          data-price="4.90"
          data-image="images/anissterne.jpg"
        >
          <div class="product-image">
            <img src="images/anissterne.jpg" alt="Anissterne" />
          </div>
          <div class="product-title">Anissterne</div>
          <div class="product-price">4.90 CHF</div>
          <button class="btn btn-outline add-to-cart">In den Warenkorb</button>
        </div>
        <!-- ... weitere Produkte ... -->
      </div>
    </main>

    <!-- Modal für Warenkorb mit Bestellformular -->
    <div id="cartModal" class="cart-modal">
      <div class="cart-modal-content">
        <span class="close-modal">&times;</span>
        <h2>Dein Warenkorb</h2>
        <div id="cartItems"></div>
        <div class="cart-total">
          Total: <span id="cartTotal">0.00</span> CHF
        </div>

        <!-- Bestellformular (Kundendaten) -->
        <h3 style="margin-top: 1.5rem">Lieferadresse</h3>
        <form id="checkoutForm">
          <div class="form-group">
            <label>Vor- und Nachname *</label>
            <input
              type="text"
              id="checkoutName"
              placeholder="Max Mustermann"
              required
            />
          </div>
          <div class="form-group">
            <label>E-Mail *</label>
            <input
              type="email"
              id="checkoutEmail"
              placeholder="max@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label>Adresse *</label>
            <input
              type="text"
              id="checkoutAdresse"
              placeholder="Strasse und Hausnummer"
              required
            />
          </div>
          <div class="form-group">
            <label>Postleitzahl *</label>
            <input type="text" id="checkoutPLZ" placeholder="8000" required />
          </div>
          <div class="form-group">
            <label>Telefon (optional)</label>
            <input
              type="text"
              id="checkoutTel"
              placeholder="+41 79 123 45 67"
            />
          </div>
          <div class="form-group">
            <label>Zahlungsart *</label>
            <select id="checkoutPayment" required>
              <option value="Kreditkarte">Kreditkarte</option>
              <option value="PayPal">PayPal</option>
              <option value="TWINT">TWINT</option>
              <option value="Rechnung">Rechnung</option>
            </select>
          </div>
          <button
            type="submit"
            id="checkoutBtn"
            class="btn"
            style="margin-top: 0.5rem; width: 100%"
          >
            Jetzt kaufen
          </button>
        </form>
        <div id="checkoutFeedback" style="margin-top: 1rem"></div>
      </div>
    </div>

    <footer>...</footer>
    <script src="script.js"></script>
  </body>
</html>
